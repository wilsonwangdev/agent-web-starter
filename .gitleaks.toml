title = "Public-source and deployment checks"

[extend]
useDefault = true

[[rules]]
id = "local-user-path"
description = "Machine-specific user directory in shareable content"
regex = '''(?:/Users/|/home/)[A-Za-z0-9._-]+(?:/[^\s"'<>)]*)?'''

[[rules]]
id = "windows-user-path"
description = "Machine-specific Windows user directory in shareable content"
regex = '''[A-Za-z]:\\{1,2}Users\\{1,2}[A-Za-z0-9._-]+'''

[[rules]]
id = "personal-email"
description = "Email address requires an explicit publication decision"
regex = '''(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'''

[[rules.allowlists]]
description = "Reserved documentation domains are synthetic examples"
regexes = ['''(?i)@(?:[a-z0-9-]+\.)*(?:example\.(?:com|org|net)|example|invalid|test)$''']

[[rules]]
id = "private-domain-url"
description = "Private-network domain in shareable content"
regex = '''(?i)https?://(?:[a-z0-9-]+\.)+(?:internal|corp|lan|local)(?:[:/\s"'<>]|$)'''
